name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  schedule:
    # Run daily at 4AM UTC
    - cron: '0 4 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['stable', 'oldstable', '1.23']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Test (purego - vectorscan SWAR fallback)
      run: go test -tags purego ./...

    - name: Benchmark
      run: go test -bench=. ./...

    - name: Race detection
      run: go test -race ./...

  compat-parity:
    # One nested bench module per compatibility layer, each diffing our port
    # against the real upstream library. Kept out of the main module so their
    # dependencies never enter the dependency-free root. GOTOOLCHAIN=auto (the
    # default) fetches the Go version each nested go.mod asks for, including
    # buildbarn's 1.26.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [boxo, buildbarn, plakar, restic]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Parity test + benchmark
      working-directory: cdc/compat/${{ matrix.layer }}/bench
      run: |
        go test -v ./...
        go test -run=NONE -bench=. -benchmem ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Fuzz test - Rolling Hash Consistency
      run: go test -fuzz=FuzzRollingHashConsistency -fuzztime=30s

    - name: Fuzz test - Write Consistency
      run: go test -fuzz=FuzzWriteConsistency -fuzztime=30s

    - name: Fuzz test - Window Reading
      run: go test -fuzz=FuzzWindowReading -fuzztime=30s

    - name: Fuzz test - Edge Cases
      run: go test -fuzz=FuzzEdgeCases -fuzztime=30s

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Test with coverage
      run: go test -v -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
