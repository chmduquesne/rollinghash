name: golangci-lint
on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: golangci-lint (rollstat)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: rollstat
      - name: golangci-lint (cdc/compat/gocdc/bench)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: cdc/compat/gocdc/bench
